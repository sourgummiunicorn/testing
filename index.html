<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disney Character Matcher</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <h1>✨ Disney Character Matcher ✨</h1>
    <p class="subtitle">Tap the button to get matched with a random Disney character!</p>

    <section class="card" aria-live="polite">
      <div class="avatar" id="characterAvatar">🎬</div>
      <h2 id="characterName">Ready to find your match?</h2>
      <p id="characterDescription">Click <strong>Match Me</strong> to reveal your Disney character.</p>
      <button id="matchButton">Match Me</button>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
